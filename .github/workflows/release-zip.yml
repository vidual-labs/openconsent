name: Release packages

# Builds all packages with build.mjs and attaches them to the GitHub release:
#   openconsent-wordpress.zip  (top-level folder "openconsent")
#   openconsent-joomla.zip
#   openconsent.js             (universal snippet)
# Runs when a release is published; can also be started by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the packages for (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PHP syntax
        run: find wordpress joomla -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build packages (fails if the tag and the plugin versions differ)
        run: |
          node build.mjs --tag "$TAG"
          node --check dist/openconsent.js
          unzip -l dist/openconsent-wordpress.zip
          unzip -l dist/openconsent-joomla.zip

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/openconsent-wordpress.zip dist/openconsent-joomla.zip dist/openconsent.js --clobber
