name: Release packages

# Builds all packages with build.mjs and attaches them to the GitHub release:
#   openconsent-wordpress-X.Y.Z.zip  (top-level folder "openconsent")
#   openconsent-joomla-X.Y.Z.zip
#   openconsent_X.Y.Z.zip            (TYPO3 extension; name required by the Extension Manager)
#   openconsent-X.Y.Z.js             (universal snippet)
# X.Y.Z is the version from the release tag (vX.Y.Z).
# Runs when a release is published; can also be started by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the packages for (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PHP syntax
        run: find wordpress joomla typo3 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build packages (fails if the tag and the plugin versions differ)
        run: |
          node build.mjs --tag "$TAG"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node --check "dist/openconsent-$VERSION.js"
          unzip -l "dist/openconsent-wordpress-$VERSION.zip"
          unzip -l "dist/openconsent-joomla-$VERSION.zip"
          unzip -l "dist/openconsent_$VERSION.zip"

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "dist/openconsent-wordpress-$VERSION.zip" \
            "dist/openconsent-joomla-$VERSION.zip" \
            "dist/openconsent_$VERSION.zip" \
            "dist/openconsent-$VERSION.js"
