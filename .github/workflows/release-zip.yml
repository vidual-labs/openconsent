name: Release ZIP

# Builds openconsent.zip (top-level folder "openconsent") and attaches it to the
# GitHub release. Runs when a release is published; can also be started by hand
# for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the ZIP for (e.g. v1.1.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check that the tag matches the plugin version
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' openconsent.php | sed -E 's/.*Version:\s*//' | tr -d '\r ')
          constant=$(grep -m1 "define( 'OC_VERSION'" openconsent.php | sed -E "s/.*'OC_VERSION', '([^']+)'.*/\1/" | tr -d '\r')
          echo "Tag: $TAG / plugin header: $header / OC_VERSION: $constant"
          if [ "${TAG#v}" != "$header" ] || [ "$header" != "$constant" ]; then
            echo "::error::Tag $TAG does not match the plugin version (header $header, OC_VERSION $constant)."
            exit 1
          fi

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build openconsent.zip
        run: |
          git archive --format=zip --prefix=openconsent/ -o openconsent.zip HEAD -- . \
            ':(exclude).github' ':(exclude)CLAUDE.md' ':(exclude)assets'
          unzip -l openconsent.zip

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" openconsent.zip --clobber
