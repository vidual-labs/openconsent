PLG_SYSTEM_OPENCONSENT="System - OpenConsent"
PLG_SYSTEM_OPENCONSENT_XML_DESCRIPTION="Cookie banner for Google Consent Mode v2 (Basic): one decision, Accept or Decline. Sets all consent types to denied and loads Google Tag Manager only after the visitor accepts. Visitors can re-open the banner with any link to <code>#openconsent</code>, e.g. a menu item of the type URL."

