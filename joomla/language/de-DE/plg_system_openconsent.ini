PLG_SYSTEM_OPENCONSENT="System - OpenConsent"
PLG_SYSTEM_OPENCONSENT_XML_DESCRIPTION="Cookie-Banner für Google Consent Mode v2 (Basic): eine Entscheidung, Akzeptieren oder Ablehnen. Setzt alle Consent-Typen auf „denied“ und lädt den Google Tag Manager erst, wenn Besucher zustimmen. Jeder Link auf <code>#openconsent</code> öffnet den Banner erneut, z. B. ein Menüeintrag vom Typ URL."

PLG_SYSTEM_OPENCONSENT_GTM_ID_LABEL="Google-Tag-Manager-ID"
PLG_SYSTEM_OPENCONSENT_GTM_ID_DESC="Ihre Container-ID, z. B. GTM-XXXXXXX. OpenConsent lädt GTM erst nach der Zustimmung. Leer lassen, wenn Sie GTM nicht nutzen. Binden Sie alle Google-Tags über diesen Container ein; anderweitig eingebundene Skripte werden nicht blockiert."
PLG_SYSTEM_OPENCONSENT_COOKIE_DURATION_LABEL="Entscheidung speichern für (Tage)"
PLG_SYSTEM_OPENCONSENT_COOKIE_DURATION_DESC="Wie lange die Entscheidung gespeichert wird, bevor der Banner erneut fragt (1–390 Tage)."
PLG_SYSTEM_OPENCONSENT_WIDGET_LABEL="Widget zum erneuten Öffnen"
PLG_SYSTEM_OPENCONSENT_WIDGET_DESC="Kleine Schaltfläche nach der Entscheidung, die den Banner wieder öffnet. Wenn Sie es ausblenden, setzen Sie einen Link auf <code>#openconsent</code> (z. B. im Footer oder in der Datenschutzerklärung), damit Besucher ihre Einwilligung widerrufen können."

